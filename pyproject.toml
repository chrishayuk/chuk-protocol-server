[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chuk-protocol-server"
version = "0.2"
description = "A production ready protocol library for tcp, websocket and telnet servers"
readme = "README.md"
authors = [
    {name = "Chris Hay", email = "your.email@example.com"},
]
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["tcp", "telnet", "websockets"]
dependencies = [
    "asyncio>=3.4.3",
    "pyyaml>=6.0.2",
    "websockets>=15.0.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]  # Change from "." to "src"
include = ["chuk_protocol_server*"]

[tool.setuptools.package-data]
"chuk_protocol_server.sample_servers.guess_who_server" = ["*.yaml", "*.yml"]
"chuk_protocol_server.sample_servers.echo_server" = ["*.yaml", "*.yml"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.5",
]

[project.urls]
Homepage = "https://github.com/chrishayuk/chuk-protocol-server"
"Bug Tracker" = "https://github.com/chrishayuk/chuk-protocol-server/issues"
Documentation = "https://github.com/chrishayuk/chuk-protocol-server#readme"

[project.scripts]
chuk-protocol-server = "chuk_protocol_server.cli:main"
server-launcher = "chuk_protocol_server.server_launcher:main"
sample-server = "chuk_protocol_server.sample_server_launcher:main"
guess-who-server = "chuk_protocol_server.guess_who_launcher:main"
echo-server = "chuk_protocol_server.echo_launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88


